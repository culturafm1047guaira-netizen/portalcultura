name: Revalidate a cada 2 horas

on:
  schedule:
    - cron: "0 */2 * * *"
  workflow_dispatch:

jobs:
  revalidate:
    runs-on: ubuntu-latest
    steps:
      - name: Revalidar página inicial
        run: |
          curl -L -X POST "${{ secrets.SITE_URL }}/api/revalidate" -H "Authorization: Bearer ${{ secrets.REVALIDATION_TOKEN }}"
